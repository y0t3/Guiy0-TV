name: Guiy0-TV - Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Android y Android TV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar SDK Android 35 desde runner de GitHub
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDKMANAGER"
          echo "Usando sdkmanager de: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Copiar web compartida a Android
        run: |
          mkdir -p android/app/src/main/assets/web
          cp index.html styles.css app.js android/app/src/main/assets/web/
          test -s android/app/src/main/assets/web/index.html

      - name: Compilar APK debug
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace

      - name: Publicar APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: Guiy0-TV-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
